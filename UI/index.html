<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light dark">
	<title>Kabirhat Private Hospital &amp; Normal Delivery Center | Management</title>
	<link rel="icon" type="image/svg+xml" href="../site_assets/Hospital_Logo.svg">
	<script>
		(function() {
			try {
				const theme = localStorage.getItem('hmss-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
				document.documentElement.setAttribute('data-theme', theme);
			} catch (e) {}
		})();
	</script>
	<link rel="stylesheet" href="../styles/index.css">
</head>
<body>
	<div id="app" aria-live="polite">
		<section class="splash" aria-label="Loading application">
			<img class="splash-mark" src="../site_assets/Hospital_Logo.svg" alt=""><span>Opening your workspace</span>
			<div class="splash-track"><i></i></div>
		</section>
	</div>
	<div id="toast-region" class="toast-region" aria-live="polite"></div>
	<script src="../node_modules/jsbarcode/dist/JsBarcode.all.min.js"></script>
	<script src="../node_modules/three/build/three.min.js"></script>
	<script src="../js/jxbw.js"></script>
	<script src="../js/analytics-model.js"></script>
	<script src="../js/analytics-visuals.js"></script>
	<script src="../js/room-billing.js"></script>
	<script src="../js/index.js" defer></script>
</body>
</html>
